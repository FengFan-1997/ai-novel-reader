services:
  - type: web
    name: shengyue-relay
    runtime: node
    plan: free
    region: virginia
    rootDir: cloud/relay
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CLOUD_ACCESS_PASSWORD
        sync: false
      - key: BRIDGE_SHARED_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PUBLIC_ORIGIN
        value: https://shengyue-fengfan.vercel.app
