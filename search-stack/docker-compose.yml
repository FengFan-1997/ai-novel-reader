services:
  searxng:
    image: searxng/searxng:latest
    container_name: shengyue-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Copy .env.example to .env and replace the secret}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
